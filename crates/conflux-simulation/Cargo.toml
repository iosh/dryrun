[package]
name = "conflux-simulation"
version = { workspace = true }
edition = { workspace = true }

[features]
serde = ["dep:alloy-serde", "simulation-core/serde", "contract-standards/serde"]

[dependencies]
simulation-core = { workspace = true, features = ["serde"] }
alloy = { workspace = true }
alloy-rpc-types = { workspace = true }
alloy-primitives = { workspace = true }
alloy-serde = { workspace = true, optional = true }
alloy-sol-types = { workspace = true }
conflux-provider = { workspace = true }
contract-standards = { workspace = true }
cfx-types = { workspace = true }
primitives = { workspace = true }
cfx-storage = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }
cfx-statedb = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }
cfx-internal-common = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }
cfx-parity-trace-types = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }
cfx-parameters = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }

cfx-executor = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }
cfx-vm-types = { git = "https://github.com/iosh/conflux-rust.git", branch = "dry" }


cfx-rpc-eth-types = { workspace = true }
keccak-hash = "0.12"
rlp = "0.6"
serde = { workspace = true }
thiserror = { workspace = true }
typemap = { package = "typemap-ors", version = "1.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
alloy-json-rpc = { workspace = true }
serde_json = { workspace = true }
tower = "0.5"
