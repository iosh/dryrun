services:
  dryrun:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: dryrun:prod
    restart: unless-stopped
    init: true
    environment:
      APP_SERVER__HOST: 0.0.0.0
      APP_SERVER__PORT: "8080"
      APP_TRACING__LEVEL: info
      APP_TRACING__FORMAT: json
      APP_ETHEREUM__RPC_URL: ${APP_ETHEREUM__RPC_URL:?set APP_ETHEREUM__RPC_URL in Portainer}
      APP_CONFLUX__ESPACE_RPC_URL: ${APP_CONFLUX__ESPACE_RPC_URL:?set APP_CONFLUX__ESPACE_RPC_URL in Portainer}
      APP_CONFLUX__CORE_SPACE_RPC_URL: ${APP_CONFLUX__CORE_SPACE_RPC_URL:?set APP_CONFLUX__CORE_SPACE_RPC_URL in Portainer}
      APP_SIMULATION__MAX_CONCURRENT: "4"
      APP_SIMULATION__RESPONSE_TIMEOUT_SECONDS: "120"
      APP_METRICS__ENABLED: "true"
      APP_METRICS__LISTEN_ADDRESS: 127.0.0.1:9000
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error --request POST --header 'content-type: application/json' --data '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"dryrun_health\",\"params\":[]}' http://127.0.0.1:8080/ | grep -q '\"result\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web-runtime
    image: dryrun-web:prod
    restart: unless-stopped
    init: true
    depends_on:
      - dryrun
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.routers.dryrun.rule: Host(`${APP_DOMAIN:?set APP_DOMAIN in Portainer}`)
      traefik.http.routers.dryrun.entrypoints: websecure
      traefik.http.routers.dryrun.tls: "true"
      traefik.http.routers.dryrun.tls.certresolver: ${TRAEFIK_CERT_RESOLVER}
      traefik.http.services.dryrun.loadbalancer.server.port: "80"
    networks:
      - default
      - proxy
    security_opt:
      - no-new-privileges:true

networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
